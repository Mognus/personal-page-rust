# Development stack. Frontend runs `next dev` with the source bind-mounted
# for hot reload. Run with: docker compose -f docker-compose.dev.yml up
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-personal_page}
      POSTGRES_USER: ${POSTGRES_USER:-personal_page}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-personal_page}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql

  migrate:
    image: rust:1-slim-bookworm
    working_dir: /app
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-personal_page}:${POSTGRES_PASSWORD:-personal_page}@postgres:5432/${POSTGRES_DB:-personal_page}
    command: >
      sh -c "cargo install sqlx-cli --no-default-features --features postgres,rustls
      && cargo sqlx migrate run"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    environment:
      SERVER_HOST: ${SERVER_HOST:-0.0.0.0}
      SERVER_PORT: ${SERVER_PORT:-8080}
      DATABASE_URL: postgres://${POSTGRES_USER:-personal_page}:${POSTGRES_PASSWORD:-personal_page}@postgres:5432/${POSTGRES_DB:-personal_page}
      JWT_SECRET: ${JWT_SECRET:-change_me}
      JWT_EXPIRES_IN_SECONDS: ${JWT_EXPIRES_IN_SECONDS:-3600}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    volumes:
      # Bind-mount the source so cargo-watch sees changes (hot-reload).
      - ./backend:/app
      # Build cache in a named volume: fast incremental builds, and no
      # root-owned target/ leaking onto the host bind mount.
      - backend_target:/app/target
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      # Pass the backend URL from the root .env into the container so the Next
      # BFF can reach the backend by its compose service name.
      BACKEND_URL: ${BACKEND_URL}
      # GitHub access for the projects + personal-setup views (server-side only).
      GITHUB_DOTFILES_REPO: ${GITHUB_DOTFILES_REPO}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
    ports:
      - "3000:3000"
    volumes:
      # Bind-mount the source so file changes reach the dev server (HMR works
      # natively on Linux via inotify — no polling env vars needed).
      - ./frontend:/app
      # Named volume for node_modules: keeps Linux-host (glibc) modules from
      # shadowing the container's (musl) build. Repopulated by the startup
      # `pnpm install`, so dep changes are picked up on restart automatically.
      - frontend_node_modules:/app/node_modules
      # Keep the build cache out of the bind mount (avoids root-owned .next on host).
      - frontend_next:/app/.next
      # Persist the pnpm store so startup installs are fast after the first run.
      - pnpm_store:/pnpm/store
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_target:
  frontend_node_modules:
  frontend_next:
  pnpm_store:
