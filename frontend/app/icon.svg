<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .s { fill: none; stroke: #1a1a1a; stroke-width: 2.75; stroke-linejoin: round }
    @media (prefers-color-scheme: dark) { .s { stroke: #f5f5f5 } }
  </style>
  <!-- Philosopher's stone, nested outside-in: circle (unity) > triangle (dualism
       plus mediating principle) > square (manifest material world) > circle (unity
       mirrored in the individual). Each shape is inscribed in the previous one. -->
  <circle class="s" cx="32" cy="32" r="27"/>
  <path class="s" d="M32 5 L55.38 45.5 L8.62 45.5 Z"/>
  <rect class="s" x="21.15" y="23.79" width="21.71" height="21.71"/>
  <circle class="s" cx="32" cy="34.65" r="10.85"/>
</svg>
