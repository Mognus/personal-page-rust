services:
  caddy:
    image: caddy:2-alpine
    container_name: ${PROJECT_NAME:-personal-page}-caddy
    environment:
      # ":80" locally; use the bare domain on the server for automatic HTTPS.
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      # Both take a comma-separated list of hosts that redirect to SITE_ADDRESS.
      # Configure WWW_ADDRESS only when the www DNS record exists.
      WWW_ADDRESS: ${WWW_ADDRESS:-www.localhost}
      OLD_SITE_ADDRESS: ${OLD_SITE_ADDRESS:-old.localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Persist certificates to avoid reissuing them after container recreation.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
    restart: always

  postgres:
    image: postgres:18-alpine
    container_name: ${PROJECT_NAME:-personal-page}-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-personal_page}
      POSTGRES_USER: ${POSTGRES_USER:-personal_page}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-personal_page}
    # No host port published in prod — only reached over the compose network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      # postgres:18 image layout — mount the parent (matches the dev compose).
      - postgres_data:/var/lib/postgresql
    restart: always

  migrate:
    image: rust:1-slim-bookworm
    container_name: ${PROJECT_NAME:-personal-page}-migrate
    working_dir: /app
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-personal_page}:${POSTGRES_PASSWORD:-personal_page}@postgres:5432/${POSTGRES_DB:-personal_page}
    command: >
      sh -c "cargo install sqlx-cli --no-default-features --features postgres,rustls
      && cargo sqlx migrate run"
    depends_on:
      postgres:
        condition: service_healthy
    # One-shot: runs migrations and exits, so no restart policy.

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ${PROJECT_NAME:-personal-page}-backend
    environment:
      SERVER_HOST: ${SERVER_HOST:-0.0.0.0}
      SERVER_PORT: ${SERVER_PORT:-8080}
      DATABASE_URL: postgres://${POSTGRES_USER:-personal_page}:${POSTGRES_PASSWORD:-personal_page}@postgres:5432/${POSTGRES_DB:-personal_page}
      JWT_SECRET: ${JWT_SECRET:-change_me}
      JWT_EXPIRES_IN_SECONDS: ${JWT_EXPIRES_IN_SECONDS:-3600}
    # No host port: the frontend BFF reaches it as http://backend:8080 over the
    # compose network; the browser never talks to it directly.
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ${PROJECT_NAME:-personal-page}-frontend
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://backend:8080}
      # GitHub access for the projects + personal-setup views (server-side only).
      GITHUB_DOTFILES_REPO: ${GITHUB_DOTFILES_REPO}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      # Where the auth-gated /api/docs route reads PDFs from (the mount below).
      DOCS_DIR: /docs
    volumes:
      # Off-repo private PDFs for the /api/docs route, read-only. Point DOCS_DIR
      # at the server folder holding them (e.g. magnus-lebenslauf.pdf); they are
      # gitignored and never enter the repo or image. Defaults to the local
      # ./frontend/private for a plain `docker compose -f docker-compose.yml` run.
      - ${DOCS_DIR:-./frontend/private}:/docs:ro
    # Documentation only: Caddy reaches this port over the compose network.
    expose:
      - "3000"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: always

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
