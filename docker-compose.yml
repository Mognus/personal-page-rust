services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-personal_page}
      POSTGRES_USER: ${POSTGRES_USER:-personal_page}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-personal_page}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql

  migrate:
    image: rust:1-slim-bookworm
    working_dir: /app
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-personal_page}:${POSTGRES_PASSWORD:-personal_page}@postgres:5432/${POSTGRES_DB:-personal_page}
    command: >
      sh -c "cargo install sqlx-cli --no-default-features --features postgres,rustls
      && cargo sqlx migrate run"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SERVER_HOST: ${SERVER_HOST:-0.0.0.0}
      SERVER_PORT: ${SERVER_PORT:-8080}
      DATABASE_URL: postgres://${POSTGRES_USER:-personal_page}:${POSTGRES_PASSWORD:-personal_page}@postgres:5432/${POSTGRES_DB:-personal_page}
      JWT_SECRET: ${JWT_SECRET:-change_me}
      JWT_EXPIRES_IN_SECONDS: ${JWT_EXPIRES_IN_SECONDS:-3600}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      BACKEND_URL: ${BACKEND_URL}
      # GitHub access for the projects + personal-setup views (server-side only).
      GITHUB_DOTFILES_REPO: ${GITHUB_DOTFILES_REPO}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
